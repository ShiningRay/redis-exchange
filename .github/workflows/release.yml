# Unified release: one `v*` tag publishes BOTH the Ruby gem (rubygems.org)
# and the npm package (npmjs.org), each via OIDC trusted publishing — no API
# keys or tokens stored anywhere.
#
# Release flow:
#   1. Release PR bumps BOTH lib/redis_exchange/version.rb and package.json
#      to the same X.Y.Z (npm rejects 4-segment versions — keep 3 segments).
#   2. Merge, then: git tag vX.Y.Z && git push origin vX.Y.Z
#   3. preflight verifies the tag matches both versions, the Ruby and Node
#      suites run in parallel, and only after ALL gates pass do the two
#      publishes fan out in parallel — a release ships whole or not at all.
#
# One-time trusted-publisher registrations (rubygems.org is already done):
#   npmjs.com → package redis-exchange → Settings → Trusted publisher:
#     repository ShiningRay/redis-exchange, workflow release.yml.
#
# workflow_dispatch lets you (re-)publish one side against an existing tag —
# pick the v* tag as the ref, or preflight's version check will fail.

name: Release (gem + npm)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Which packages to publish (ref must be a v* tag)'
        type: choice
        default: all
        options: [all, gem-only, npm-only]

permissions:
  contents: read

# A tag event and a manual re-run can collide; only one release per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Tag matches both package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          RUBY_V="$(ruby -r ./lib/redis_exchange/version -e 'puts RedisExchange::VERSION')"
          NPM_V="$(node -p "require('./package.json').version")"
          echo "tag=$TAG gem=$RUBY_V npm=$NPM_V"
          [ "$TAG" = "$RUBY_V" ] || { echo "::error::tag v$TAG does not match gem version $RUBY_V"; exit 1; }
          [ "$TAG" = "$NPM_V" ] || { echo "::error::tag v$TAG does not match npm version $NPM_V"; exit 1; }

  test-ruby:
    name: Ruby test suite
    if: inputs.packages != 'npm-only'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install rdb-cli
        run: |
          sudo apt-get update && sudo apt-get install -y jq redis-tools
          git clone https://github.com/redis/librdb.git
          cd librdb
          make
          mkdir -p ../bin
          cp bin/rdb-cli ../bin/rdb-cli
      - name: Run tests
        env:
          SPEC_REDIS_URL: redis://localhost:6379/15
        run: bundle exec rake

  test-node:
    name: Node test suite
    if: inputs.packages != 'gem-only'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        env:
          SPEC_REDIS_URL: redis://localhost:6379/15
        run: npm test

  publish-gem:
    name: Publish gem to rubygems.org
    needs: [preflight, test-ruby, test-node]
    if: >-
      ${{
        inputs.packages != 'npm-only' &&
        !cancelled() &&
        needs.preflight.result == 'success' &&
        needs.test-ruby.result == 'success' &&
        (needs.test-node.result == 'success' || needs.test-node.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for rubygems.org trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Configure RubyGems credentials
        # No floating tags exist for this action; pin an exact version.
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Build and push gem
        run: |
          gem build redis_exchange.gemspec
          gem push "redis_exchange-$(ruby -r ./lib/redis_exchange/version -e 'puts RedisExchange::VERSION').gem"

  publish-npm:
    name: Publish npm package
    needs: [preflight, test-node]
    if: >-
      ${{
        inputs.packages != 'gem-only' &&
        !cancelled() &&
        needs.preflight.result == 'success' &&
        needs.test-node.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Publish
        run: npm publish --provenance
