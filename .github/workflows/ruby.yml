# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.4', '4.0']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
    # uses: ruby/setup-ruby@v1
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Install rdb-cli
      run: |
        sudo apt-get update && sudo apt-get install -y jq redis-tools
        git clone https://github.com/redis/librdb.git
        cd librdb
        make
        mkdir -p ../bin
        cp bin/rdb-cli ../bin/rdb-cli
    - name: Run tests
      env:
        SPEC_REDIS_URL: redis://localhost:6379/15
      run: bundle exec rake

  # Dense random trading operations against a real Redis, then replay the
  # account ledger and reconcile balances. Fails the build on any discrepancy.
  random-audit:
    name: Random ops + ledger replay audit (ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '4.0']
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run dense random operations with final ledger replay audit
      run: |
        bundle exec ruby script/random_bot.rb \
          --redis-url redis://localhost:6379/15 \
          --flush \
          --concurrency 5 \
          --iterations 1000 \
          --sleep-min 0 --sleep-max 0 \
          --quiet \
          --audit
